spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 550MB
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/my_web_school_project}
mybatis:
  configuration:
    map-underscore-to-camel-case: true       # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL

  mapper-locations: classpath:mapper/*.xml

# 阿里云 OSS 配置 — 敏感信息通过环境变量注入（勿提交真实 Key）
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:wang-java-ai}

# 小工具箱配置
toolbox:
  convert:
    temp-dir: ${java.io.tmpdir}/toolbox/
    max-file-size: 52428800
    expiration-days: 7
    libreoffice:
      # LibreOffice 安装路径（Windows 默认路径，找不到则回退到 PDFBox/POI）
      soffice-path: C:/Program Files/LibreOffice/program/soffice.exe
      # 单次转换超时（秒）
      timeout-seconds: 30
    wkhtml:
      # wkhtmltopdf 安装路径（WebKit 引擎，MD→PDF 首选项，效果接近 Typora）
      executable-path: C:/Program Files/wkhtmltopdf/bin/wkhtmltopdf.exe
      timeout-seconds: 30