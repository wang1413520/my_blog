# ============================================
# 生产环境配置
# 使用方式：java -jar app.jar --spring.profiles.active=prod
# 或设置环境变量 SPRING_PROFILES_ACTIVE=prod
# ============================================

spring:
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/my_web_school_project}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 550MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不打印 SQL（避免日志膨胀）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath:mapper/*.xml

# 阿里云 OSS（敏感信息通过环境变量注入）
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:wang-java-ai}

# 小工具箱
toolbox:
  convert:
    # Linux 服务器临时目录
    temp-dir: /tmp/toolbox/
    max-file-size: 52428800
    expiration-days: 7
    libreoffice:
      # Linux 下 LibreOffice 典型路径
      soffice-path: /usr/bin/soffice
      timeout-seconds: 30
    wkhtml:
      # Linux 下 wkhtmltopdf 典型路径
      executable-path: /usr/local/bin/wkhtmltopdf
      timeout-seconds: 30
